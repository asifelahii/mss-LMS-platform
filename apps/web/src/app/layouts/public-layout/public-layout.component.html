        alt="MSS - Math and Science Seekers"
        class="mss-brand-logo"
      />

    <nav class="mss-public-nav" aria-label="Public navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
